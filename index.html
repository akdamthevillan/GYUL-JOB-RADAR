<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff8f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1612" media="(prefers-color-scheme: dark)">
<meta name="description" content="귤을 위한 부산·김해·양산 디자인·콘텐츠·마케팅 맞춤 채용 추천">
<title>귤의 워라밸 판독기 | GYUL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<defs><radialGradient id="gyulShade" cx="65%" cy="70%" r="70%"><stop offset="0" stop-color="#e8650a" stop-opacity=".35"/><stop offset="1" stop-color="#e8650a" stop-opacity="0"/></radialGradient></defs>
<symbol id="gyul" viewBox="0 0 24 24"><circle cx="12" cy="13.6" r="8.6" fill="#ff9a2e"/><circle cx="12" cy="13.6" r="8.6" fill="url(#gyulShade)"/><ellipse cx="8.7" cy="10.6" rx="2.3" ry="1.6" fill="#ffd29a" opacity=".85" transform="rotate(-30 8.7 10.6)"/><path d="M12.2 5.4c.2-1.9 1.7-3.3 3.8-3.4.1 2-1.4 3.6-3.5 3.7z" fill="#4e9a5b"/><path d="M12 4.6v1.8" stroke="#8a5424" stroke-width="1.3" stroke-linecap="round"/></symbol>
</svg>
<header class="site-head"><div class="head-inner"><a href="./" class="brand"><svg class="brand-icon" aria-hidden="true"><use href="#gyul"/></svg><span><b>GYUL</b> JOB RADAR</span></a><span id="review" class="headnote">목록 불러오는 중</span></div></header>
<main>
<section class="stats" aria-label="공고 현황">
<button type="button" class="stat" data-stat="open" aria-pressed="false"><span class="stat-icon" aria-hidden="true">🍊</span><strong id="statsOpen">0</strong><span>지원 가능</span></button>
<button type="button" class="stat" data-stat="new" aria-pressed="false"><span class="stat-icon" aria-hidden="true">✨</span><strong id="statsNew">0</strong><span>새 공고 · 7일</span></button>
<button type="button" class="stat" data-stat="soon" aria-pressed="false"><span class="stat-icon" aria-hidden="true">⏰</span><strong id="statsSoon">0</strong><span>마감 임박 · 7일</span></button>
</section>
<section class="toolbar" aria-label="공고 검색">
<label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg><input id="search" type="search" placeholder="회사 · 직무 · 지역 · 복지 검색" aria-label="공고 검색"></label>
<div class="chips" role="group" aria-label="빠른 필터">
<button type="button" class="chip" data-chip="newbie" aria-pressed="false">신입 가능</button>
<button type="button" class="chip" data-chip="pay" aria-pressed="false">연봉 3,000↑</button>
<button type="button" class="chip" data-chip="salaryOpen" aria-pressed="false">연봉 공개</button>
<button type="button" class="chip" data-chip="new" aria-pressed="false">새 공고</button>
<button type="button" class="chip" data-chip="soon" aria-pressed="false">마감 임박</button>
</div>
</section>
<section class="subtools" aria-label="정렬과 보기">
<div class="selects">
<select class="field" id="region" aria-label="지역"><option value="">전체 지역</option></select>
<select class="field" id="role" aria-label="직무"><option value="">전체 직무</option></select>
<select class="field" id="sort" aria-label="정렬"><option value="recommended">귤 당도순</option><option value="distance">거리순 · 직선거리</option><option value="transit">대중교통 시간순</option><option value="salary">연봉 높은 순</option><option value="size">회사 규모순 · 직원 수</option><option value="region">지역 선호순</option><option value="newest">신규순</option><option value="deadline">마감 임박순</option><option value="company">회사명순</option></select>
</div>
<div class="segmented" role="group" aria-label="보기"><button class="segment" type="button" data-view="all" aria-pressed="true">전체</button><button class="segment" type="button" data-view="favorites" aria-pressed="false">관심</button><button class="segment" type="button" data-view="applied" aria-pressed="false">지원 기록</button><button class="segment" type="button" data-view="hidden" aria-pressed="false">숨긴 공고</button></div>
</section>
<p id="storageNotice" class="note" role="status"></p>
<div class="list-head"><span id="count" class="count">0개 공고</span><details class="panel inline"><summary>귤 당도 기준</summary><div id="profile"></div></details></div>
<div id="loadError" class="review-notice" hidden role="alert">공고를 불러오지 못했습니다. <button id="retry" class="button" type="button">다시 불러오기</button></div>
<section class="cards" id="cards" aria-live="polite"></section>
<div class="more-wrap"><button id="more" class="button" type="button" hidden>더 보기</button><button id="low" class="button ghost" type="button" hidden>당도 낮은 공고도 보기</button></div>
<details class="panel"><summary>공고 확인 결과 전달하기</summary><p class="note">직접 본 결과로 전달용 JSON을 만듭니다. 자동 게시되지 않으며 저장소 소유자의 검토가 필요합니다. 공개 Issue에 개인정보나 로그인 화면을 첨부하지 마세요.</p><form id="reviewForm" class="manual-form"><label>사람인 공고 URL<input class="field" name="url" required type="url"></label><label>관찰 시각 (한국시간)<input class="field" name="observed" required type="datetime-local"></label><label>회사명<input class="field" name="company" required maxlength="200"></label><label>공고 제목<input class="field" name="title" required maxlength="400"></label><label>관찰 결과<select class="field" name="result"><option value="unknown">미확인·접근 불가</option><option value="apply_enabled">활성 입사지원 버튼 확인</option><option value="closed">명시적 접수마감 확인</option></select></label><label>확인 방식<select class="field" name="method"><option value="page_dom">실제 공고 페이지 코드·DOM</option><option value="browser_visual">실제 브라우저 화면</option><option value="user_screenshot">사용자 스크린샷</option></select></label><label class="wide">관찰 내용 (외부 지원이면 지원 방법도 기록)<textarea class="field" name="evidence" required maxlength="2000"></textarea></label><button class="button" type="submit">전달용 JSON 만들기</button><p id="reviewMessage" class="note" role="status"></p><textarea id="reviewOutput" class="field wide" rows="8" readonly aria-label="전달용 JSON" hidden></textarea></form></details>
<footer class="footer">지원 버튼 확인은 관찰 당시의 상태입니다. 실제 제출 성공이나 현재 모집을 보장하지 않습니다.</footer>
</main>
<script src="./assets/radar.js" defer></script>
<script src="./assets/app.js" defer></script>
</body>
</html>
