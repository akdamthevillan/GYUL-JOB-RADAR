<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8f5">
<meta name="description" content="부산 디자인·마케팅·기획 채용 공고 목록">
<title>GYUL JOB RADAR · 부산 채용</title>
<style>
:root{--bg:#f7f8f5;--surface:#fff;--text:#202a25;--sub:#5c6a60;--line:#e1e7e1;--primary:#205d41;--soft:#edf3ec;--muted:#f1f3f0;--orange:#c56225;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--primary)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #8bbc9b;outline-offset:2px}
.site-head{background:#fff;border-bottom:1px solid var(--line)}.head-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:19px 22px;gap:12px}.brand{font-size:23px;font-weight:850;letter-spacing:-.6px;text-decoration:none;color:var(--text)}.headnote{font-size:12px;color:var(--sub)}
main{max-width:1180px;margin:28px auto 60px;padding:0 22px}.overview{display:flex;align-items:end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}h1{margin:0;font-size:26px;letter-spacing:-.6px}h2{font-size:18px}.subtitle,.review-date{font-size:13px;color:var(--sub)}.review-date{margin-top:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 16px}.stat strong{font-size:24px;display:block;line-height:1.2;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--sub)}.tools{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;margin-bottom:16px}.tool-row{display:grid;grid-template-columns:minmax(180px,2fr) repeat(3,minmax(105px,1fr));gap:10px;margin-bottom:10px}.tool-row:last-child{margin-bottom:0}.field{background:#fff;border:1px solid #d7dfd6;border-radius:9px;padding:11px 12px;width:100%;min-height:44px;color:var(--text)}.toggles{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.segmented{display:flex;gap:7px;flex-wrap:wrap}.chipbutton{border:1px solid var(--line);border-radius:8px;background:#fff;color:#3a4b3e;padding:8px 12px;font-size:13px}.chipbutton[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}.checkbox{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer}.checkbox input{accent-color:var(--primary);width:16px;height:16px}
.top-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:10px 0 15px}.count{font-size:14px;font-weight:700}.actions{display:flex;align-items:center;gap:8px}.button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;font-size:13px;font-weight:650;color:#35443a}.button.primary{background:var(--primary);border-color:var(--primary);color:#fff}.button.small{padding:7px 11px}.button.ghost{border:0;background:transparent}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;gap:13px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:19px;min-width:0}.card-top{display:flex;align-items:start;justify-content:space-between;gap:9px}.company{font-size:16px;font-weight:800;letter-spacing:-.3px;overflow-wrap:anywhere}.jobtitle{margin:3px 0 0;font-size:18px;letter-spacing:-.4px;font-weight:700;overflow-wrap:anywhere}.badge-group{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.badge{background:var(--muted);color:#5d665e;border-radius:6px;font-size:11px;font-weight:600;padding:4px 7px}.badge.good{background:#eaf4e9;color:#205b38}.badge.warn{background:#fdf3e6;color:#8e581f}.badge.new{background:#fff0e1;color:#a24a16}.favorite{border:1px solid var(--line);border-radius:9px;background:#fff;width:39px;height:39px;font-size:20px;color:#94a29a;flex:none}.favorite[aria-pressed=true]{color:var(--orange);background:#fff7ed;border-color:#edd5c0}.facts{display:grid;gap:0;margin:0;background:#f7f9f6;border-radius:10px;padding:3px 13px}.fact{display:grid;grid-template-columns:65px minmax(0,1fr);gap:11px;border-bottom:1px solid #e9eee8;padding:9px 0;font-size:13px}.fact:last-child{border-bottom:0}.fact dt{color:var(--sub);font-weight:650}.fact dd{margin:0;min-width:0;white-space:normal;overflow-wrap:anywhere}.card-note{font-size:12px;color:#526056;margin:0}.card-bottom{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}.card-bottom .dates{font-size:12px;color:var(--sub);min-height:35px;line-height:1.5}.card-buttons{display:grid;grid-template-columns:minmax(74px,1fr) minmax(52px,.7fr) minmax(126px,1.8fr);gap:8px;width:100%;align-items:stretch}.card-buttons>*{display:flex;justify-content:center;align-items:center;min-width:0;min-height:40px;margin:0;text-align:center;text-decoration:none;white-space:nowrap}.empty{text-align:center;border:1px dashed #cbd6cb;border-radius:14px;padding:52px 16px;background:#fff;color:var(--sub);grid-column:1/-1}.empty strong{color:var(--text);display:block;font-size:18px;margin-bottom:6px}
details.panel{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}details.panel summary{font-weight:750;cursor:pointer}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}.tag{font-size:12px;border:1px solid #dbe4db;border-radius:30px;padding:5px 9px;background:var(--soft);color:#3e5e43}.keyword-header{font-weight:700;margin-top:14px;font-size:13px}.note{font-size:12px;color:var(--sub)}.quicklinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quicklinks a{background:var(--soft);color:var(--primary);padding:8px 10px;text-decoration:none;border-radius:7px;font-size:12px}.quicklinks a:hover{text-decoration:underline}.manual-form{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.manual-form input,.manual-form select{width:100%}.manual-form .wide{grid-column:1/-1}.manual-form .button{justify-self:start}.footer{padding:25px 0;color:#6e7d72;font-size:12px}.error{color:#a03223}.sort-field{max-width:170px}.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.update-hint{font-size:12px;color:var(--sub);margin:2px 0 12px}
@media(max-width:800px){.tool-row{grid-template-columns:repeat(2,minmax(0,1fr))}.tool-row input{grid-column:1/-1}.cards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){main{padding:0 14px;margin-top:20px}.head-inner{padding:16px 14px}.brand{font-size:20px}.headnote{font-size:11px}.stat{padding:12px}.tool-row{display:flex;flex-direction:column;gap:8px}.manual-form{grid-template-columns:1fr}.manual-form .wide{grid-column:1}.card{padding:15px}.sort-field{max-width:100%}.facts{padding:3px 11px}.fact{grid-template-columns:57px 1fr}}
.fact .fact-link{color:var(--primary);font-weight:650;text-decoration:underline;text-underline-offset:2px}.fact .inline-link{font-size:12px;margin-left:7px;display:inline-block}.business-summary{padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff}.business-summary h3{font-size:13px;margin:0 0 8px}.business-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.business-metrics .metric{font-size:12px;padding:8px;background:var(--soft);border-radius:8px;min-width:0}.business-metrics .metric span{display:block;color:var(--sub);font-size:11px}.business-metrics .metric strong{font-size:14px;overflow-wrap:anywhere}.business-summary small{display:block;font-size:11px;color:var(--sub);margin-top:7px}.business-summary a{font-size:12px}.card .commute-note{font-size:11px;color:var(--sub);margin-top:3px}.map-link{font-size:12px;white-space:nowrap;margin-left:5px}.card .dates{line-height:1.6}.review-notice{border:1px solid #ead8ba;background:#fff9f0;color:#835921;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:14px}.review-notice[hidden]{display:none}@media(max-width:380px){.card-buttons{grid-template-columns:64px 41px minmax(0,1fr);gap:5px}.card-buttons .button{padding:7px 3px;font-size:11px}} </style>
</head>
<body>
<header class="site-head"><div class="head-inner"><a href="./" class="brand">🍊 GYUL JOB RADAR</a></div></header>
<main>
<section class="overview"><div><h1>부산 · 김해 · 양산 채용공고</h1><div id="review" class="review-date">목록 불러오는 중</div></div></section>
<section class="stats" aria-label="공고 현황">
<div class="stat"><strong id="statsAll">0</strong><span>등록 공고</span></div>
<div class="stat"><strong id="statsNew">0</strong><span>접수 확인</span></div>
<div class="stat"><strong id="statsRecent">0</strong><span>최근 모집정보</span></div>
<div class="stat"><strong id="statsChecked">0</strong><span>접수 미확인</span></div>
</section>
<section class="tools" aria-label="공고 검색">
<div class="tool-row">
<input class="field" id="search" type="search" placeholder="기업명 · 직무 · 위치 · 경력 검색" aria-label="공고 검색">
<select class="field" id="region" aria-label="지역"><option value="">전체 지역</option></select>
<select class="field" id="role" aria-label="직무"><option value="">전체 직무</option></select>
<select class="field" id="sort" aria-label="정렬"><option value="region">지역 우선순</option><option value="recommended">직무 추천순</option><option value="newest">신규순</option><option value="deadline">마감 임박순</option><option value="company">회사명순</option></select>
</div>
<div class="toggles"><div class="segmented"><button class="chipbutton" type="button" data-view="all" aria-pressed="true">전체</button><button class="chipbutton" type="button" data-view="favorites" aria-pressed="false">관심</button><button class="chipbutton" type="button" data-view="applied" aria-pressed="false">지원 기록</button></div><label class="checkbox"><input type="checkbox" id="salaryOnly">연봉 공개만</label></div>
</section>
<div class="top-actions"><span id="count" class="count">0개 공고</span></div>
<section class="cards" id="cards" aria-live="polite"></section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id),LOCAL_KEY="gyul-radar-preferences-v3",MANUAL_KEY="gyul-radar-manual-v3";
const escapeHTML=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KST=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const today=KST();
const dateMinus=(str,n)=>{const x=new Date(str+"T12:00:00+09:00");x.setTime(x.getTime()-n*86400000);return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(x)};
const recentThreshold=dateMinus(today,7);
const store=(k,obj)=>{try{localStorage.setItem(k,JSON.stringify(obj))}catch{}};
const load=(k,otherwise)=>{try{const x=JSON.parse(localStorage.getItem(k)||"null");return x??otherwise}catch{return otherwise}};
const prefs=load(LOCAL_KEY,{favorites:[],applied:[],hidden:[]});let dataset=[],localData=load(MANUAL_KEY,[]),config=null,view="all",closedIds=new Set();
const validUrl=u=>{try{const p=new URL(u);return p.protocol==="https:"&&["saramin.co.kr","www.saramin.co.kr","www2.saramin.co.kr","m.saramin.co.kr"].includes(p.host)?p.href:""}catch{return""}};
const normalize=s=>String(s||"").normalize("NFKC").toLowerCase().replace(/[\s()[\]\-_.]+/g,"");
const sourceId=j=>{try{const u=new URL(j.url);let num=u.searchParams.get("rec_idx");return num&&/^\d{5,16}$/.test(num)?num:null}catch{return null}};
const mobilePostingUrl=j=>{const id=sourceId(j);return id?"https://m.saramin.co.kr/job-search/view?rec_idx="+id:validUrl(j.url)};
const keyOf=j=>sourceId(j)?"r:"+sourceId(j):"f:"+[j.company,j.title,j.location].map(normalize).join("|");
const identity=j=>keyOf(j);
const isClosed=j=>{let state=String(j.status||"").toLowerCase();return ["마감","접수마감","채용마감","closed","expired"].includes(state)||!!(j.deadline&&/^\d{4}-\d\d-\d\d$/.test(j.deadline)&&j.deadline<today)};
const isVerified=j=>["접수중","모집중","open_verified","verified_open"].includes(String(j.status||"").toLowerCase())&&!!j.verified_at&&j.verified_at>=today&&!!String(j.verification_evidence||"").trim();
const isRecentListing=j=>j.status==="recently_listed"&&!!j.listing_checked_at&&j.listing_checked_at>=dateMinus(today,3)&&!!j.listing_evidence&&!!j.deadline&&j.deadline>=today;
const isDisplayCandidate=j=>isVerified(j)||isRecentListing(j);
const closingSoon=j=>j.deadline&&j.deadline>=today&&j.deadline<=dateMinus(today,-7);
const isNew=j=>j.first_seen&&j.first_seen>=recentThreshold&&j.first_seen<=today;
const text=x=>String(x??"").trim(),label=(x,fallback="공고 확인")=>text(x)||fallback;
const score=j=>{let n=Number(j.score||0);if(j.employment&&String(j.employment).includes("정규"))n+=4;if(String(j.location).includes("사상구"))n+=6;return n};
function regionRank(j){const loc=String(j.location||"");const order=(config&&config.priority_regions)||["사상구","부산진구","연제구","수영구"];const k=order.findIndex(r=>loc.includes(r));return k<0?999:k}
function unique(list){const ids=new Set(),fallbacks=new Set(),out=[];for(const j of list){if(!j||!j.company||!j.title||!validUrl(j.url)||isClosed(j)||closedIds.has(String(sourceId(j)||j.id)))continue;const r=sourceId(j),f=[j.company,j.title,j.location].map(normalize).join("|");if((r&&ids.has(r))||fallbacks.has(f))continue;if(r)ids.add(r);fallbacks.add(f);out.push(j)}return out}
function allJobs(){return unique([...(Array.isArray(localData)?localData:[]),...dataset]).filter(j=>!prefs.hidden.includes(identity(j)))}
function filtered(){const query=normalize($("search").value),region=$("region").value,role=$("role").value,salary=$("salaryOnly").checked;
let jobs=allJobs().filter(j=>(!query||normalize([j.company,j.title,j.location,j.salary,j.benefits,j.considerations,j.category,j.experience,j.employment].join(" ")).includes(query))&&(!region||String(j.location||"").includes(region))&&(!role||String(j.category||"")===role)&&(!salary||!!(j.salary&&!/미공개|면접 후|협의|확인|내규/.test(j.salary)))&&(view==="all"||prefs[view==="favorites"?"favorites":"applied"].includes(identity(j))));
const sort=$("sort").value;return jobs.sort((a,b)=>sort==="region"?(regionRank(a)-regionRank(b)||score(b)-score(a)):sort==="company"?String(a.company).localeCompare(String(b.company),"ko"):sort==="deadline"?(a.deadline||"9999").localeCompare(b.deadline||"9999"):sort==="newest"?String(b.first_seen||"").localeCompare(String(a.first_seen||"")):(score(b)-score(a)||regionRank(a)-regionRank(b))) }

const fact=(name,value)=>'<div class="fact"><dt>'+escapeHTML(name)+'</dt><dd>'+escapeHTML(value)+'</dd></div>';
const safeKakaoUrl=u=>{try{const p=new URL(u);return p.protocol==="https:"&&["map.kakao.com","m.map.kakao.com"].includes(p.host)?p.href:""}catch{return""}};
const destinationAddress=j=>{const v=String(j.location||"").trim();return /확인 필요|미공개|주소 없음/.test(v)?null:v};
function mapHref(j){
 const address=destinationAddress(j);
 if(!address)return "";
 return "https://map.kakao.com/link/search/"+encodeURIComponent(address);
}
function routeHref(j){
 if(j.transit_route_url)return safeKakaoUrl(j.transit_route_url);
 // The Kakao routing link format requires verified lat/lng for both places.
 const p=j.coordinates,o=j.origin_coordinates;
 if(!p||!o||![p.lat,p.lng,o.lat,o.lng].every(v=>Number.isFinite(Number(v))))return "";
 return "https://map.kakao.com/link/by/traffic/"+encodeURIComponent("냉정역")+
 ","+encodeURIComponent(String(o.lat))+","+encodeURIComponent(String(o.lng))+
 "/"+encodeURIComponent(String(j.company))+
 ","+encodeURIComponent(String(p.lat))+","+encodeURIComponent(String(p.lng));
}
function locationFact(j){
 const address=destinationAddress(j);
 return '<div class="fact"><dt>주소</dt><dd>'+escapeHTML(label(j.location,"주소 확인 필요"))+
 (address?'<a class="map-link" href="'+escapeHTML(mapHref(j))+'" target="_blank" rel="noopener noreferrer">카카오맵 ↗</a>':'')+
 '</dd></div>';
}
function transitFact(j){
 const n=Number(j.transit_minutes),valid=j.transit_minutes!==null&&j.transit_minutes!==undefined&&Number.isFinite(n)&&n>0&&!!j.transit_checked_at;
 const route=routeHref(j),search=mapHref(j);
 const value=valid?'<strong>냉정역(2호선) → 약 '+escapeHTML(Math.round(n))+'분</strong>':'냉정역(2호선) → 소요시간 미확인';
 const small=valid?'<div class="commute-note">'+escapeHTML(j.transit_checked_at)+' 기준 · 대중교통</div>':'<div class="commute-note">카카오 대중교통 경로 확인 필요</div>';
 const link=route?'<a class="inline-link" target="_blank" rel="noopener noreferrer" href="'+escapeHTML(route)+'">길찾기 ↗</a>':(search?'<a class="inline-link" target="_blank" rel="noopener noreferrer" href="'+escapeHTML(search)+'">목적지 검색 ↗</a>':'');
 return '<div class="fact"><dt>통근</dt><dd>'+value+link+small+'</dd></div>';
}
const metricNames={revenue:"매출액",operating_profit:"영업이익",avg_salary:"평균연봉",employees:"직원수",recent_hires:"최근 입사",recent_leavers:"최근 퇴사"};
function metrics(j){
 const info=j.company_info||{};
 const cells=Object.keys(metricNames).filter(k=>info[k]&&info[k].value).map(k=>{
  const item=info[k],period=item.year||item.period||item.as_of||"기준시점 미상";
  const u=item.source_url||j.company_url;
  const link=u&&validUrl(u)?'<a href="'+escapeHTML(u)+'" target="_blank" rel="noopener noreferrer">출처 ↗</a>':'';
  return '<div class="metric"><span>'+metricNames[k]+'</span><strong>'+escapeHTML(item.value)+'</strong><div>'+escapeHTML(period)+' '+link+'</div></div>';
 });
 if(!cells.length){return j.company_url&&validUrl(j.company_url)?
 '<div class="business-summary"><h3>기업정보</h3><a href="'+escapeHTML(j.company_url)+'" target="_blank" rel="noopener noreferrer">사람인 기업정보 보기 ↗</a></div>':''}
 return '<div class="business-summary"><h3>기업정보 · 사람인</h3><div class="business-metrics">'+cells.join('')+'</div><small>기업 전체 수치입니다. 해당 채용 연봉이 아니며, 공시·추정 기준에 따라 차이가 있습니다.</small></div>';
}
function card(j){
 const id=identity(j),fav=prefs.favorites.includes(id),applied=prefs.applied.includes(id),url=mobilePostingUrl(j);
 const tags=[isVerified(j)?'<span class="badge good">접수 확인</span>':isRecentListing(j)?'<span class="badge warn">접수 미확인 · 최근 노출</span>':'<span class="badge warn">접수 상태 미확인</span>',isNew(j)?'<span class="badge new">NEW</span>':'',closingSoon(j)?'<span class="badge warn">마감 임박</span>':''].filter(Boolean).join("");
 const observed=j.listing_checked_at?'<div>최근 검색 확인 '+escapeHTML(j.listing_checked_at)+' · 조기마감 가능</div>':"";
 const seen=j.first_seen?'<div>목록 추가 '+escapeHTML(j.first_seen)+'</div>':'';
 const verified=j.source_checked_at?'<div>정보 확인 '+escapeHTML(j.source_checked_at)+'</div>':'';
 return '<article class="card"><div class="card-top"><div><div class="company">'+escapeHTML(j.company)+'</div><div class="jobtitle">'+escapeHTML(j.title)+'</div><div class="badge-group">'+tags+'</div></div><button type="button" class="favorite" data-action="favorite" data-id="'+escapeHTML(id)+'" aria-pressed="'+fav+'" title="관심 공고" aria-label="관심 공고">'+(fav?"★":"☆")+'</button></div>'+
 '<dl class="facts">'+locationFact(j)+transitFact(j)+fact("경력",label(j.experience,"경력요건 확인 필요"))+
 fact("고용형태",label(j.employment,"공고 확인"))+fact("연봉",label(j.salary,"미공개"))+
 fact("복지",label(j.benefits,"미공개"))+fact("등록일",label(j.posted_at,"원문 확인"))+
 fact("접수",isVerified(j)?"접수 확인":isRecentListing(j)?"최근 검색에 노출 · 접수 여부 미확인":"접수 상태 미확인")+
 fact("직무",label(j.category,"미분류"))+'</dl>'+
 metrics(j)+(j.considerations?'<p class="card-note"><b>기타</b> · '+escapeHTML(j.considerations)+'</p>':'')+
 '<div class="card-bottom"><div class="dates">마감 '+escapeHTML(j.deadline||j.deadline_text||"확인 필요")+seen+observed+verified+'</div><div class="card-buttons"><button type="button" class="button small" data-action="applied" data-id="'+escapeHTML(id)+'">'+(applied?"지원 완료 ✓":"지원 표시")+'</button><button type="button" class="button small ghost" data-action="hide" data-id="'+escapeHTML(id)+'" title="이 브라우저에서 숨기기">숨김</button><a class="button primary small" href="'+escapeHTML(url)+'" target="_blank" rel="noopener noreferrer">모바일 접수 확인 ↗</a></div></div></article>';
}
function render(){const visible=allJobs(),confirmed=visible.filter(isVerified),recent=visible.filter(j=>!isVerified(j)&&isRecentListing(j)),unknown=visible.filter(j=>!isVerified(j)&&!isRecentListing(j)),list=filtered();
$("statsAll").textContent=visible.length;$("statsNew").textContent=confirmed.length;$("statsRecent").textContent=recent.length;$("statsChecked").textContent=unknown.length;$("count").textContent=list.length+"개 공고";
$("cards").innerHTML=list.length?list.map(card).join(""):'<div class="empty"><strong>표시할 공고가 없습니다</strong>검색 조건에 맞는 공고가 없습니다.</div>'}
function renderConfig(){if(!config)return;for(const r of config.focus||[]){const op=document.createElement("option");op.value=r;op.textContent=r;$("region").append(op)}for(const g of config.groups||[]){const op=document.createElement("option");op.value=g.name;op.textContent=g.name;$("role").append(op)}}
$("cards").addEventListener("click",e=>{const btn=e.target.closest("button[data-action]");if(!btn)return;const id=btn.dataset.id,action=btn.dataset.action;if(action==="hide"){if(!confirm("이 브라우저에서 공고를 숨기시겠습니까?"))return;prefs.hidden.push(id)}else{const arr=prefs[action],n=arr.indexOf(id);if(n<0)arr.push(id);else arr.splice(n,1)}store(LOCAL_KEY,prefs);render()});
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll("[data-view]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.view===view)));render()});
["search","region","role","sort","salaryOnly"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));
Promise.all([fetch("./data/jobs.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("jobs");return r.json()}),fetch("./data/meta.json",{cache:"no-store"}).then(r=>r.json()),fetch("./data/search-config.json",{cache:"no-store"}).then(r=>r.json()),fetch("./data/closed-postings.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("closed");return r.json()})]).then(([jobs,meta,cfg,closed])=>{dataset=Array.isArray(jobs)?jobs:[];closedIds=new Set((closed.postings||[]).map(p=>String(p.id)));config=cfg;$("review").textContent=meta.last_review_date?"최근 점검 "+meta.last_review_date+" · 마감일 경과 공고 자동 제외":"새 공고 수집 대기 · 마감 공고 자동 제외";renderConfig();render()}).catch(()=>{$("review").textContent="목록을 불러오지 못했습니다.";$("review").classList.add("error");render()});
</script>
