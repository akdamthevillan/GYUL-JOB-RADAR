<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="부산 디자인·마케팅·기획 공고"><title>GYUL JOB RADAR</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#252d27;background:#f7f8f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e9e1;padding:22px max(24px,calc((100vw - 1120px)/2))}header b{font-size:23px;letter-spacing:-.6px}header small{display:block;color:#667568;margin-top:4px}main{max-width:1120px;margin:32px auto;padding:0 22px}h1{font-size:26px;margin:0 0 18px}.status{font-size:13px;color:#566558;margin-bottom:22px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}.stats div{background:#fff;border:1px solid #e2e7de;border-radius:12px;padding:15px 24px;min-width:160px}.stats strong{display:block;font-size:27px}.stats span{font-size:12px;color:#667568}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}input,select{border:1px solid #dae1d7;border-radius:9px;padding:12px;background:#fff;font:inherit;min-width:140px}input{flex:1;min-width:230px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0}button{cursor:pointer;border-radius:9px;padding:9px 14px;background:#1c6642;color:#fff;border:0;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{background:white;border:1px solid #e2e7de;border-radius:14px;padding:21px;min-width:0}article h2{margin:9px 0 8px;font-size:19px}article .company{font-weight:700;color:#27392d}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.chip{font-size:12px;background:#f0f3ee;padding:5px 8px;border-radius:6px;color:#44574a}.chip.closed{background:#eee;color:#6f7671}.chip.fresh{background:#e8f4e9;color:#206039}article p{font-size:14px;color:#4d5c52;line-height:1.6;margin:7px 0}article .note{border-top:1px solid #eee;padding-top:10px;margin-top:12px}article a{display:inline-block;margin-top:12px;color:#146443;text-underline-offset:3px;font-weight:650}footer{padding:35px 0;font-size:12px;color:#788078}a{color:inherit}@media(max-width:720px){.grid{grid-template-columns:1fr}header{padding:20px 22px}main{margin-top:24px}.stats div{flex:1;min-width:100px;padding:12px}}
.quick,.manual{background:#fff;border:1px solid #e2e7de;border-radius:14px;padding:19px;margin:0 0 20px}.quick h2{font-size:18px;margin:0 0 4px}.quick p,.tip{color:#667568;font-size:12px;margin:0 0 12px}.shortcuts{display:flex;gap:8px;flex-wrap:wrap}.shortcuts a{padding:9px 12px;background:#f1f5f0;border-radius:8px;font-size:13px;color:#1f5b38;text-decoration:none}.shortcuts a:hover{text-decoration:underline}.manual summary{cursor:pointer;font-weight:700}.manual form{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.manual input{flex:1 1 235px}.manual .tip{margin:0}</style></head><body><header><b>🍊 GYUL JOB RADAR</b><small>부산 · 디자인 / 마케팅 / 기획</small></header><main><h1>채용공고</h1><div id="status" class="status">자료 확인 중</div><section class="stats"><div><strong id="total">–</strong><span>저장된 공고</span></div><div><strong id="recent">–</strong><span>최근 발견</span></div><div><strong id="unknown">–</strong><span>접수 확인 필요</span></div></section><section class="quick" aria-label="사람인 검색 바로가기"><h2>사람인 실시간 검색</h2><p>부산 지역 · 원본 검색 결과로 이동</p><div class="shortcuts"><a href="https://www.saramin.co.kr/zf_user/jobs/list/domestic?loc_mcd=106000" target="_blank" rel="noopener">부산 전체 ↗</a><a href="https://www.saramin.co.kr/zf_user/search/recruit?searchType=search&loc_mcd=106000&searchword=%EC%8B%9C%EA%B0%81%EB%94%94%EC%9E%90%EC%9D%B8" target="_blank" rel="noopener">시각디자인 ↗</a><a href="https://www.saramin.co.kr/zf_user/search/recruit?searchType=search&loc_mcd=106000&searchword=%ED%8C%A8%ED%82%A4%EC%A7%80%EB%94%94%EC%9E%90%EC%9D%B8" target="_blank" rel="noopener">패키지 ↗</a><a href="https://www.saramin.co.kr/zf_user/search/recruit?searchType=search&loc_mcd=106000&searchword=%EC%BD%98%ED%85%90%EC%B8%A0%EB%A7%88%EC%BC%80%ED%8C%85" target="_blank" rel="noopener">콘텐츠 마케팅 ↗</a><a href="https://www.saramin.co.kr/zf_user/search/recruit?searchType=search&loc_mcd=106000&searchword=SNS%EB%A7%88%EC%BC%80%ED%8C%85" target="_blank" rel="noopener">SNS ↗</a><a href="https://www.saramin.co.kr/zf_user/search/recruit?searchType=search&loc_mcd=106000&searchword=%EC%83%81%ED%92%88%EA%B8%B0%ED%9A%8D" target="_blank" rel="noopener">상품기획 ↗</a><a href="https://www.saramin.co.kr/zf_user/search/recruit?searchType=search&loc_mcd=106000&searchword=GTQ" target="_blank" rel="noopener">GTQ ↗</a><a href="https://www.saramin.co.kr/zf_user/search/recruit?searchType=search&loc_mcd=106000&searchword=Illustrator" target="_blank" rel="noopener">Illustrator ↗</a></div></section><details class="manual"><summary>공고 직접 추가</summary><form id="addForm"><input id="customCompany" placeholder="회사명" required maxlength="80"><input id="customTitle" placeholder="모집 직무" required maxlength="140"><input id="customUrl" type="url" placeholder="사람인 공고 링크 (https://...)" required><input id="customLocation" placeholder="위치 (예: 부산 사상구)" maxlength="90"><input id="customSalary" placeholder="연봉"><input id="customBenefits" placeholder="복지"><input id="customNote" placeholder="고려할 점"><button type="submit">추가하기</button></form><p class="tip">직접 추가한 항목은 이 브라우저에만 저장됩니다.</p></details><div class="filters"><input id="query" placeholder="기업명 · 직무 · 지역 검색" aria-label="검색"><select id="area" aria-label="지역"><option value="">부산 전체</option><option>사상구</option><option>부산진구</option><option>사하구</option><option>연제구</option><option>해운대구</option><option>동래구</option><option>북구</option><option>남구</option><option>수영구</option><option>기장군</option></select><select id="type" aria-label="직무"><option value="">전체 직무</option><option>디자인</option><option>마케팅·기획</option><option>MD·상품기획</option></select><select id="state" aria-label="접수상태"><option value="">전체 상태</option><option value="check">확인 필요</option><option value="closed">기한 경과</option></select></div><div class="toolbar"><span id="count"></span><button id="csv">CSV 저장</button></div><section class="grid" id="cards"></section><footer>공고 출처: 사람인 · 공고 수집 결과는 실제 모집 여부를 보장하지 않습니다. 조건은 공고 원문에서 확인하세요. 사람인과 제휴 관계가 없습니다.</footer></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let rows=[],meta={};function closed(j){return j.status==='마감'||Boolean(j.deadline&&j.deadline<today())}function safe(u){try{const x=new URL(u);return x.protocol==='https:'&&['www.saramin.co.kr','saramin.co.kr','www2.saramin.co.kr'].includes(x.host)?x.href:''}catch{return''}}
function filtered(){const q=$('query').value.trim().toLowerCase(),a=$('area').value,t=$('type').value,s=$('state').value;return rows.filter(j=>(!q||[j.company,j.title,j.location,j.considerations].join(' ').toLowerCase().includes(q))&&(!a||j.location.includes(a))&&(!t||j.category===t)&&(!s||(s==='closed'?closed(j):!closed(j)))).sort((a,b)=>Number(closed(a))-Number(closed(b))||Number(b.score||0)-Number(a.score||0))}
function paint(){const list=filtered();$('count').textContent=list.length+'건';$('cards').innerHTML=list.map(j=>'<article><div class="chips"><span class="chip '+(closed(j)?'closed':'')+'">'+(closed(j)?'기한 경과':'접수 확인 필요')+'</span><span class="chip">'+esc(j.category||'미분류')+'</span>'+(j.origin==='검색 색인'?'<span class="chip fresh">새 공고</span>':'')+'</div><div class="company">'+esc(j.company)+'</div><h2>'+esc(j.title)+'</h2><p>'+esc(j.location||'부산 · 상세 위치 확인')+'</p><p><b>급여</b> '+esc(j.salary||'미공개')+'</p><p><b>복지</b> '+esc(j.benefits||'공고 확인')+'</p><p><b>마감</b> '+esc(j.deadline||j.deadline_text||'확인 필요')+'</p><p class="note">'+esc(j.considerations||'상세 업무·지원요건 확인 필요')+'</p>'+(safe(j.url)?'<a href="'+esc(safe(j.url))+'" target="_blank" rel="noopener noreferrer">사람인 공고 ↗</a>':'')+'</article>').join('')||'<p>공고가 없습니다.</p>'}

const STORAGE='gyul-radar-manual-v1';
function ownRows(){try{return JSON.parse(localStorage.getItem(STORAGE)||'[]').filter(x=>x&&safe(x.url))}catch{return[]}}
function mergeOwn(){const saved=ownRows();const ids=new Set(rows.map(x=>String(x.id)));for(const j of saved)if(!ids.has(String(j.id)))rows.unshift(j)}
function updateSummary(){$('total').textContent=rows.length;$('recent').textContent=rows.filter(x=>x.first_seen===today()).length;$('unknown').textContent=rows.filter(x=>!closed(x)).length}
$('addForm').onsubmit=e=>{e.preventDefault();const url=$('customUrl').value.trim();if(!safe(url)){alert('사람인 공고 링크만 등록할 수 있습니다.');return}const row={id:'manual-'+Date.now(),company:$('customCompany').value.trim(),title:$('customTitle').value.trim(),url,location:$('customLocation').value.trim()||'부산 · 근무지 확인',salary:$('customSalary').value.trim()||'원문 확인',benefits:$('customBenefits').value.trim()||'원문 확인',considerations:$('customNote').value.trim()||'원문 확인',deadline:null,status:'재확인 필요',category:'디자인',origin:'직접 등록',first_seen:today(),score:90};const data=ownRows();data.unshift(row);localStorage.setItem(STORAGE,JSON.stringify(data.slice(0,200)));rows.unshift(row);$('addForm').reset();updateSummary();paint();};
Promise.all([fetch('./data/jobs.json',{cache:'no-store'}).then(x=>x.json()),fetch('./data/meta.json',{cache:'no-store'}).then(x=>x.json())]).then(([j,m])=>{rows=j;meta=m;mergeOwn();const fresh=rows.filter(x=>x.first_seen===today());$('total').textContent=rows.length;$('recent').textContent=fresh.length;$('unknown').textContent=rows.filter(x=>!closed(x)).length;$('status').textContent=(m.last_review_date?'마지막 검토: '+m.last_review_date:'검토 기록 없음')+' · 원문에서 접수 여부 확인';paint()}).catch(()=>{$('status').textContent='데이터를 불러오지 못했습니다.'});for(const id of ['query','area','type','state'])$(id).addEventListener(id==='query'?'input':'change',paint);$('csv').onclick=()=>{const cols=['company','title','location','salary','benefits','considerations','deadline','url'],header=['회사명','직무','위치','연봉','복지','고려할 점','마감일','사람인 링크'],quote=s=>{s=String(s??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv='\ufeff'+[header,...filtered().map(j=>cols.map(k=>j[k]??''))].map(row=>row.map(quote).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='GYUL_Busan_Jobs.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
