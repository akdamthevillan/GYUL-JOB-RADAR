name: Enrich verified commute times
on:
  workflow_dispatch:
  schedule:
    # KST 00:25 and 12:25
    - cron: '25 3,15 * * *'
permissions:
  contents: write
concurrency:
  group: gyul-commute-enrichment
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kakao Maps public transit lookup
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python scripts/kakao_commute.py
      - name: Save verified travel times
        run: |
          if ! git diff --quiet -- data/jobs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/jobs.json
            git commit -m "data: refresh Kakao Maps transit times"
            git push
          fi
