name: Validate GYUL data automation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Validate browser script syntax
        run: |
          python -c "from pathlib import Path; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/gyul-ui.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/gyul-ui.js
